site_name: Xmas Wichtel
site_author: Yannick Heiser
docs_dir: source

theme:
  language: en
  name: material
  features:
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Setup: setup.md
  - Admin guide: admin.md
  - Code reference: reference.md
