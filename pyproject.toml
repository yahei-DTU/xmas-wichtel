[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "xmas_wichtel"
version = "0.0.1"
description = "Family wishlists and a secret santa draw, hosted on GitHub Pages with Supabase."
authors = [
  { name = "Yannick Heiser", email = "yheiser@gmx.de" },
]

keywords = ["secret-santa", "wichtel", "wishlist", "supabase"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "supabase>=2.34.1",
]

[project.scripts]
wichtel = "xmas_wichtel.cli:main"

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "ruff==0.14.11",
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.1",
    "mkdocstrings-python==2.0.2",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.3.9",
]

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
